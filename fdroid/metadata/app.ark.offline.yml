MaintainerNotes: |-
  Expo/React Native app. The committed android/ project carries standard/fdroid
  distribution flavors. The recipe builds the fdroid variant with:
  - `ARK_DISTRIBUTION=fdroid` (metro + react-native.config.js) so the local
    LLM/ExecuTorch runtimes are shimmed in the JS bundle and excluded from
    autolinking; their node_modules dirs are scandeleted because the fdroid
    build does not use them.
  - `-ParkDistribution=fdroid` so modules/ark-ocr drops Google ML Kit and
    compiles the unsupported-OCR stub (PDFBox text extraction stays shared).
  - `-ParkAbiSplits=false` for one universal APK.
  - `scripts/fdroid-prepare.sh` installs the pinned Bun (1.3.3) from its npm
    package and runs `bun install --frozen-lockfile`; Ark uses bun.lock because
    npm cannot apply Ark's patchedDependencies (tentap-editor, uniwind).
  - Reduced Gradle heap via ARK_GRADLE_XMX_MB / ARK_GRADLE_WORKERS env vars.

  Scanner status (local fdroidserver 2.4.5 run, macOS install): ~438 findings,
  all in node_modules prebuilt artifacts (Expo SDK local-maven-repo AAR/JAR,
  react-native/Hermes, Skia, MapLibre, valhalla-mobile, kiwix, llama.rn,
  ExecuTorch) plus the ML Kit coordinate string. The scanignore set above is
  directory-scoped and covers the known cross-platform surface; the definitive
  set must be reconciled against the F-Droid Linux build server output (unused
  scanignore paths are errors there, and macOS-only artifacts like fsevents and
  @esbuild/darwin are absent on Linux). Keep entries narrow; do not add a broad
  `scanignore: node_modules`.

  Open items before submission:
  - Tag the exact RC and replace TODO_TAG_FOR_FIRST_FDROID_RC.
  - Run the recipe on the F-Droid build server, fix scanner/build findings, and
    remove `disable:`.
  - Verify the resulting APK on a physical device (fresh install, maps, routing,
    ZIM, PDF text extraction, notes, backups, background location).

