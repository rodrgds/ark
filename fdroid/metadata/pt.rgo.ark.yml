AutoName: Ark
Description: |-
  Ark is an offline-first survival computer for mobile.

  It combines downloadable maps, emergency knowledge packs, secure notes and documents,
  local source search, cached feeds and weather, recorded tracks, and practical sensor
  tools. On-device AI and image OCR require Google ML Kit / bundled model runtimes and
  are intentionally not shipped in the F-Droid edition: the F-Droid build excludes Google
  ML Kit and the local LLM/ExecuTorch runtimes, so image text recognition and local chat
  are unavailable in this build. PDF text-layer extraction and imported document search
  still work.

  Ark has no backend account system, no ads, no analytics, and no cloud sync.

RepoType: git
Repo: https://github.com/rodrgds/ark.git

Builds:
  - versionName: 1.2.0
    versionCode: 3
    commit: v1.2.0
    subdir: android
    sudo:
      - apt-get update
      - apt-get install -y openjdk-21-jdk-headless nodejs npm
      - update-java-alternatives -a
      - npm install --global bun@1.3.3
    output: app/build/outputs/apk/fdroid/release/app-fdroid-release.apk
    prebuild:
      - cd ..
      - bash scripts/fdroid-prepare.sh
      - cd android && printf 'org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
        -Dfile.encoding=UTF-8\norg.gradle.parallel=false\norg.gradle.workers.max=2\n'
        >> gradle.properties
    scanignore:
      - modules/ark-ocr/android/build.gradle
      - node_modules/ark-ocr/android/build.gradle
      - node_modules/@shopify
      - node_modules/react-native
      - node_modules/expo
      - node_modules/@expo
      - node_modules/@maplibre
      - node_modules/@esbuild
      - node_modules/fb-dotslash
      - node_modules/ark-routing
      - node_modules/ark-system-colors
      - node_modules/unimodules-app-loader
      - node_modules/blake3-wasm
      - node_modules/canvaskit-wasm
      - node_modules/shiki
      - node_modules/@cloudflare
      - node_modules/hermes-compiler
      - node_modules/vite
      - node_modules/@img
      - node_modules/@react-native-community/netinfo
      - node_modules/@react-native-masked-view
    scandelete:
      - node_modules/llama.rn
    build:
      - export ARK_DISTRIBUTION=fdroid
      - gradle assembleFdroidRelease -ParkAbiSplits=false -ParkDistribution=fdroid

MaintainerNotes: |-
  Expo/React Native app. The committed android/ project carries standard/fdroid
  distribution flavors. The recipe builds the fdroid variant with:
  - `ARK_DISTRIBUTION=fdroid` (metro + react-native.config.js) so the local
    LLM/ExecuTorch runtimes are shimmed in the JS bundle and excluded from
    autolinking. Their node_modules prebuilt binaries are covered by the
    `node_modules/react-native` scanignore prefix (prefix matching also covers
    react-native-executorch, so it stays in the source tree but is excluded
    from the APK); `node_modules/llama.rn` is scandeleted.
  - `-ParkDistribution=fdroid` so modules/ark-ocr drops Google ML Kit and
    compiles the unsupported-OCR stub (PDFBox text extraction stays shared).
  - `-ParkAbiSplits=false` for one universal APK.
  - `scripts/fdroid-prepare.sh` installs the pinned Bun (1.3.3) from its npm
    package and runs `bun install --frozen-lockfile`; Ark uses bun.lock because
    npm cannot apply Ark's patchedDependencies (tentap-editor, uniwind).
  - The F-Droid build does not run expo prebuild, so it appends a reduced
    Gradle heap (4096m, parallel off, 2 workers) to android/gradle.properties
    in prebuild; the committed 12 GiB default is for local/CI prebuilds.

  Scanner status: a fdroidserver 2.4.5 scan on a Debian container with a real
  Linux `bun install --frozen-lockfile` of tag v1.1.0 reports 0 findings with
  the scanignore/scandelete set above (no unused paths). The set is deliberately
  prefix-scoped: `node_modules/react-native` also covers the react-native-*
  satellite packages and `node_modules/expo` covers the expo-* packages that
  ship prebuilt AAR/JAR/Hermes/Skia artifacts. Only FOSS packages are ignored;
  the only non-FOSS coordinate (Google ML Kit) is gated out of the fdroid
  dependency graph in modules/ark-ocr and ignored here only for its build.gradle
  mention. Do not add a broad `scanignore: node_modules`.

  Open items before submission:
  - Run the tagged recipe on the F-Droid build server (fdroiddata GitLab
    pipeline), confirm the universal APK builds, then remove `disable:` and
    open the New App merge request.
  - Device smoke of the F-Droid APK is partly done (crash fix verified); a full
    pass (maps, routing, ZIM, PDF text extraction, notes, backups, background
    location) is tracked in docs/android-device-smoke.md.

